# GitHub Actions Workflow Template für Manga Shelf Releases
# Sobald in GitHub ein Personal Access Token (PAT) mit dem Scope 'workflow' eingerichtet ist,
# kann diese Datei nach .github/workflows/release.yml verschoben werden.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Frontend & Create Package
        run: npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pterodactyl-manga-shelf.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
