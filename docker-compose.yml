services:
  manga-shelf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manga-shelf
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Optional: eigenes Secret (mind. 32 Zeichen). Ohne Angabe wird automatisch ein
      # zufälliges Secret erzeugt und in der Datenbank gespeichert.
      # - JWT_SECRET=<mind. 32 zufällige Zeichen, z. B. via `openssl rand -hex 32`>
    volumes:
      - ./data:/app/data
