# Manual release ("Run workflow" in the Actions tab). The branch comes from "Use workflow from".
#   action build:   build every artifact of that branch (nothing is pushed or published)
#   action release: only with a protected main and required reviewers on the environment release; set the version (bump),
#                   commit + tag vX.Y.Z on the branch, build everything (incl. the apps), push the Docker image to GHCR under
#                   its immutable tags (X.Y.Z, vX.Y.Z), sign SHA256SUMS.txt with the version marker and the image keyless
#                   (job sign in the environment release, the only one with id-token), create the GitHub release with all
#                   files, SHA256SUMS.txt and its Sigstore bundle, and only then move X.Y and latest to that image
# A pushed tag alone never publishes anything; a failed run never moves latest. With a protected branch the push needs the secret RELEASE_TOKEN
# (fine-grained PAT, contents: write); otherwise GITHUB_TOKEN is used.
name: Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: build = build artifacts only, release = build and publish
        type: choice
        options: [build, release]
        default: build
      bump:
        description: version bump (none = version from package.json, the tag must not exist yet)
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Target version
        id: bump
        env:
          BUMP: ${{ inputs.action == 'release' && inputs.bump || 'none' }}
        run: node scripts/release/bump-version.js "$BUMP"
      - name: Release only from a branch and only with a new tag
        if: inputs.action == 'release'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "::error::Release nur von einem Branch (gewählt: $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::Release nur vom Standard-Branch ${{ github.event.repository.default_branch }} (gewählt: $GITHUB_REF_NAME); action=build geht von jedem Branch"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG existiert bereits; veröffentlichte Tags werden nie verschoben"
            exit 1
          fi
      - name: Release only with a protected main and reviewers on the release environment
        if: inputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          protected="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected')"
          reviewed="$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '[.[] | select(.type == "pull_request" and (.parameters.required_approving_review_count // 0) >= 1)] | length')"
          if [ "$protected" != true ] && [ "$reviewed" = 0 ]; then
            echo "::error::main ist nicht geschützt (Branch-Schutz oder Ruleset mit Pflicht-Review); Server installieren alles, was release.yml auf main signiert"
            exit 1
          fi
          if ! reviewers="$(gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')" || [ "$reviewers" = 0 ]; then
            echo "::error::Die Umgebung release fehlt oder hat keine Pflicht-Reviewer (Settings → Environments → release → Required reviewers)"
            exit 1
          fi

  tag:
    name: Set version, commit and tag
    needs: version
    if: inputs.action == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Push commit vX.Y.Z and tag
        id: push
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          written="$(node scripts/release/bump-version.js "$BUMP" --write)"
          if [ "$written" != "$VERSION" ]; then
            echo "::error::Version $written weicht von $VERSION ab"
            exit 1
          fi
          if ! git diff --quiet; then
            git commit -am "$TAG"
          fi
          git tag -a "$TAG" -m "Manga Shelf $TAG"
          git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [version, tag]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.tag.outputs.sha || github.sha }}
      version: ${{ needs.version.outputs.version }}
      publish: ${{ inputs.action == 'release' }}
      installers: true
    secrets: inherit

  mobile:
    name: Mobile apps
    needs: [version, tag]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    permissions:
      contents: read
    uses: ./.github/workflows/mobile.yml
    with:
      ref: ${{ needs.tag.outputs.sha || github.sha }}
      mode: build
      publish: ${{ inputs.action == 'release' }}
    secrets: inherit

  docker:
    name: Docker image to GHCR (fixed tags)
    needs: [version, tag, build, mobile]
    if: inputs.action == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - name: Image name (ghcr.io/<owner>/manga-shelf, lower case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern=v{{version}},value=${{ needs.version.outputs.tag }}
          flavor: |
            latest=false
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ needs.tag.outputs.sha }}
          cache-from: type=gha,scope=manga-shelf-image
          cache-to: type=gha,mode=max,scope=manga-shelf-image

  sign:
    name: Sign SHA256SUMS.txt and the image (Sigstore, keyless)
    needs: [version, tag, build, mobile, docker]
    if: inputs.action == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Keyless signing only for a public repository
        if: github.event.repository.private
        run: |
          echo "::error::Das Repository ist privat; eine keyless Signatur schriebe seinen Namen ins öffentliche Rekor-Log"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{pterodactyl-zip,server-*,desktop-*,mobile-*}'
          path: dist/release
          merge-multiple: true
      - name: Version marker and SHA256SUMS.txt
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.tag.outputs.sha }}
        run: |
          test -f dist/release/pterodactyl-manga-shelf.zip
          node scripts/release/marker.js dist/release "$VERSION" "$COMMIT"
          node scripts/release/checksums.js dist/release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Keyless signature of SHA256SUMS.txt (cosign, Actions OIDC)
        run: |
          for attempt in 1 2 3; do
            if cosign sign-blob --yes --bundle dist/release/SHA256SUMS.txt.sigstore.json dist/release/SHA256SUMS.txt; then
              exit 0
            fi
            rm -f dist/release/SHA256SUMS.txt.sigstore.json
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::cosign sign-blob ist dreimal gescheitert"
          exit 1
      - name: Verify the bundle with the server's own verifier before anything is published
        run: env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN node scripts/release/verify-bundle.js dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signature
          path: |
            dist/release/SHA256SUMS.txt
            dist/release/SHA256SUMS.txt.sigstore.json
            dist/release/manga-shelf-release-v*.json
          if-no-files-found: error
      - name: Keyless signature of the image (cosign, Actions OIDC)
        continue-on-error: true
        env:
          IMAGE: ${{ needs.docker.outputs.image }}@${{ needs.docker.outputs.digest }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$IMAGE"

  publish:
    name: GitHub release
    needs: [version, tag, build, mobile, docker, sign]
    if: inputs.action == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{pterodactyl-zip,server-*,desktop-*,mobile-*,release-signature}'
          path: dist/release
          merge-multiple: true
      - name: Exactly the files the sign job signed
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test -f dist/release/pterodactyl-manga-shelf.zip
          test -f dist/release/SHA256SUMS.txt.sigstore.json
          test -f "dist/release/manga-shelf-release-v$VERSION.json"
          node scripts/release/checksums.js dist/release --verify --complete
      - name: Release text
        env:
          TAG: ${{ needs.version.outputs.tag }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_SHARE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROVISIONING_PROFILE_BASE64 }}
        run: node scripts/release/notes.js "$TAG" > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Manga Shelf ${{ needs.version.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          make_latest: 'true'
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/release/*
      # only now that the release exists: X.Y and latest point at the image of this release (same digest, no rebuild)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Move X.Y and latest to the published image
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
          DIGEST: ${{ needs.docker.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "::error::Kein Image-Digest aus dem docker-Job"; exit 1 ;; esac
          minor="$(echo "$VERSION" | cut -d. -f1,2)"
          docker buildx imagetools create --tag "$IMAGE:$minor" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:latest"
