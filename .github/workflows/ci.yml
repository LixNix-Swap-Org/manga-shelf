name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t manga-shelf:ci .
      - name: Smoke test (container starts and answers)
        run: |
          docker run -d --name ms -p 3000:3000 manga-shelf:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:3000/api/health && exit 0
            sleep 1
          done
          docker logs ms
          exit 1

  browser:
    # Real browser (Chrome from the runner image) against an isolated server, see test/browser/run.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm run test:e2e
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm run test:radar
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Keep screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: test/browser/screenshots
