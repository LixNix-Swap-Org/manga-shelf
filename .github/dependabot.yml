version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "globals"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
        update-types: ["major"]
    ignore:
      # Tailwind 4 needs a migration (config format); Vite 8 (Rolldown) keeps the WATCH_BUILD dead chunks in the web
      # build and moves app-only code into the initial load, so vite and @vitejs/plugin-react majors wait
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # jsdom 30 needs Node >= 22.22.2; the project floor is 22.13.0
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]

  # desktop/ and mobile/ track Electron and Capacitor; their majors need a migration
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # one pull request for all actions: SHA-pinned bumps carry no update type and would otherwise come one by one
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # keeps the pinned node:22.x-alpine base image in the Dockerfile current
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
