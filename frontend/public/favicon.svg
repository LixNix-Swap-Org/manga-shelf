<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Glow circle -->
  <circle cx="256" cy="256" r="140" fill="#0284c7" opacity="0.18" filter="url(#glow)" />

  <!-- Manga Book Icon Graphic -->
  <g transform="translate(106, 116) scale(1.25)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left book page -->
    <path d="M 120 190 C 70 160 20 170 10 175 L 10 35 C 20 30 70 20 120 50 Z" 
          fill="url(#brand-grad)" fill-opacity="0.15" stroke="url(#brand-grad)" stroke-width="12" />
    <!-- Right book page -->
    <path d="M 120 190 C 170 160 220 170 230 175 L 230 35 C 220 30 170 20 120 50 Z" 
          fill="url(#brand-grad)" fill-opacity="0.15" stroke="url(#brand-grad)" stroke-width="12" />
    <!-- Spine center -->
    <line x1="120" y1="50" x2="120" y2="190" stroke="url(#brand-grad)" stroke-width="12" />
    
    <!-- Manga speedlines / page lines -->
    <line x1="38" y1="75" x2="95" y2="90" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity="0.7" />
    <line x1="38" y1="110" x2="95" y2="125" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity="0.7" />
    <line x1="38" y1="145" x2="95" y2="160" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity="0.7" />

    <line x1="145" y1="90" x2="202" y2="75" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity="0.7" />
    <line x1="145" y1="125" x2="202" y2="110" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity="0.7" />
    <line x1="145" y1="160" x2="202" y2="145" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity="0.7" />

    <!-- Bookmark ribbon -->
    <path d="M 120 50 L 120 140 L 105 125 L 90 140 L 90 42 Z" fill="url(#accent-grad)" stroke="url(#accent-grad)" stroke-width="3" />
  </g>
</svg>
